name: CI

# One required check, "ci", on every pull request. A release acceptance run is
# a manual dispatch with full=true on the exact commit; it adds the "full" job.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Also run the release-only job on both supported Node versions
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ezclassify/.github/actions/setup-node-npm@da1e243029be7e724f808cca11e385e6d79eee8b
        with:
          node-version: '22'

      # Plain Node scripts, so they run before anything is installed.
      - name: Mirror publish list is complete
        run: node scripts/check-mirror-list.mjs

      - name: Lockfile and dependency age
        run: |
          if [ -f package-lock.json ]; then
            npm run check:lockfile-portable
            npm run check:dependency-age
          fi

      # This repository depends on no EzClassify package, so the install is
      # third-party only and needs no registry beyond npmjs. With no committed
      # lockfile, deps:relock creates one from versions at least seven days old
      # and checks it before anything installs. It runs only when the lockfile
      # is missing, because it deletes the file before it re-resolves.
      - name: Install dependencies
        run: |
          test -f package-lock.json || npm run deps:relock
          npm ci

      - name: Formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Public spec carries nothing private
        # This repository owns openapi.yaml, so the spec is checked here:
        # frozen operation surface, no reserved namespaces, no entitlement
        # vocabulary in contract names, no unreachable component, and the JSON
        # restatement in step with the YAML.
        run: npm run check:spec

      - name: Spec matches the route declarations it is generated from
        # Rebuilds openapi.yaml in memory and fails on any difference, so a hand
        # edit to the committed spec, or a wire-type change that was never
        # regenerated, cannot reach a consumer.
        run: npm run check:openapi

      - name: Validator bin runs end-to-end
        # The validator ships a bin a community author is told to run on day
        # one, so the published entry point is exercised, not just the
        # functions behind it.
        run: node packages/validator/bin/ezclassify-validate.mjs libs/types/examples/scheme-with-import.yaml

      - name: Working tree is clean after build
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  full:
    name: full
    needs: ci
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ezclassify/.github/actions/setup-node-npm@da1e243029be7e724f808cca11e385e6d79eee8b
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          test -f package-lock.json || npm run deps:relock
          npm ci

      - name: Build
        run: npm run build

      # Generation is CI-owned. The committed OpenAPI document and package
      # notices must come out byte-identical on every supported Node version.
      - name: Generate the canonical OpenAPI document
        run: npm run codegen

      - name: Generate native package notices
        run: npm run notices

      - name: Test
        run: npm test

      - name: Every published export is documented
        # TypeDoc fails on any exported declaration, member or parameter
        # without a doc comment, so the API reference and every editor tooltip
        # say what a field means.
        run: npm run docs:check

      - name: Validator bin runs end-to-end
        run: node packages/validator/bin/ezclassify-validate.mjs libs/types/examples/scheme-with-import.yaml

      - name: Working tree is clean after generation
        run: git diff --exit-code && test -z "$(git status --porcelain)"
