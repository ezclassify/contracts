name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  policy:
    uses: ezclassify/.github/.github/workflows/ci-policy.yml@a42ece80f520858a2926723d12bba2af2dca0474
    with:
      primary-version: '22'
      full-versions: '["22","24"]'
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: ${{ fromJSON(needs.policy.outputs.versions) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ezclassify/.github/actions/setup-node-npm@a42ece80f520858a2926723d12bba2af2dca0474 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      # This repository depends on no EzClassify package, so the install is
      # third-party only and needs no registry beyond npmjs. That is the point
      # of the boundary. With no committed lockfile, CI creates one from an
      # empty dependency tree and immediately proves it with a frozen install.
      #
      # deps:relock runs only when there is no lockfile, because it deletes
      # the file before it re-resolves. Regenerating a committed lockfile here
      # would re-resolve every floating third-party range on every run, which
      # both throws away the reviewed versions and leaves the tree dirty for
      # the clean-tree step below. It resolves only versions at least seven
      # days old and checks the result before anything installs.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm run check:lockfile-portable
            npm run check:dependency-age
          else
            npm run deps:relock
          fi
          npm ci

      - name: Formatting
        run: npm run format:check

      - name: Audit dependencies
        run: npm audit --audit-level=critical

      - name: Mirror publish list is complete and installable
        # The mirror carries 1.0.0-mirror.N only, and npm will not match a
        # prerelease against a "^1.0.0" range. A first-party dependency written
        # that way installs fine here, where the sibling is a workspace link,
        # and is unresolvable for every consumer. Checked on every commit
        # rather than only in the nightly publish, because the commit that
        # introduces it is where it is cheap to see.
        run: node scripts/check-mirror-list.mjs

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Public spec carries nothing private
        # This repository owns openapi.yaml, so the spec is checked here
        # rather than downstream: frozen operation surface, no reserved
        # namespaces, no entitlement vocabulary in contract names, no component
        # left unreachable, and the JSON restatement in step with the YAML.
        run: npm run check:spec

      - name: Every published export is documented
        # TypeDoc reads each published package's entry points and fails on any
        # exported declaration, member or parameter without a doc comment, so
        # the API reference and every editor tooltip say what a field means.
        run: npm run docs:check
        if: ${{ needs.policy.outputs.full == 'true' }}

      - name: Spec matches the route declarations it is generated from
        # libs/openapi/openapi.yaml is generated here from the route
        # declarations beside it plus the published types. This rebuilds it in
        # memory and fails on any difference, so a hand edit to the committed
        # spec, or a wire-type change that was never regenerated, cannot reach
        # a consumer.
        run: npm run check:openapi

      - name: Working tree is clean after build
        run: git diff --exit-code && test -z "$(git status --porcelain)"

      - name: Validator bin runs end-to-end
        # The validator ships a bin a community author is told to run on day
        # one, so the published entry point is exercised here and not just the
        # functions behind it.
        run: node packages/validator/bin/ezclassify-validate.mjs libs/types/examples/context-with-sources.yaml
    needs:
      - policy
    if: ${{ needs.policy.result == 'success' }}
  qualification:
    needs:
      - policy
      - build-and-test
    if: ${{ always() && !cancelled() && needs.policy.result == 'success' && needs.policy.outputs.full == 'true' }}
    uses: ezclassify/.github/.github/workflows/ci-result.yml@a42ece80f520858a2926723d12bba2af2dca0474
    with:
      results: ${{ toJSON(needs) }}
      full: ${{ needs.policy.outputs.full == 'true' }}
      full-only: '[]'
      optional: '[]'
  ci:
    needs:
      - policy
      - build-and-test
      - qualification
    if: ${{ always() && !cancelled() }}
    uses: ezclassify/.github/.github/workflows/ci-result.yml@a42ece80f520858a2926723d12bba2af2dca0474
    with:
      results: ${{ toJSON(needs) }}
      full: ${{ needs.policy.outputs.full == 'true' }}
      full-only: '["qualification"]'
      optional: '[]'
run-name: CI · ${{ github.event_name }} · ${{ github.ref_name }}
