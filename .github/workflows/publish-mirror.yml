name: Prepare mirror (GitHub Packages)

# Contracts owns native mirror preparation. Release Train publishes the sealed
# files separately with its protected credential; native build and proof code
# receive read-only access. Manual dispatch prepares the current main source.

on:
  schedule:
    - cron: '45 5 * * *' # 05:45 UTC nightly, ahead of every repo that consumes this
  workflow_dispatch:

permissions:
  packages: read
  contents: read

concurrency:
  group: publish-mirror
  cancel-in-progress: false

jobs:
  prepare:
    # Only the enabled official main prepares native files for the conductor.
    if: github.repository == 'ezclassify/contracts' && github.ref == 'refs/heads/main' && vars.EZ_DEVELOPMENT_MIRROR_PUBLISHER == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.gate.outputs.run }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

        with:
          persist-credentials: false

      - name: Gate on a commit in the last 24h
        id: gate
        # The gate covers the cron only. Someone who dispatches this by hand
        # means to publish, so a manual run always publishes and there is no
        # `force` input to get wrong.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual dispatch: preparing"; echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          age=$(( $(date +%s) - $(git show -s --format=%ct HEAD) ))
          if [ "$age" -lt 86400 ]; then
            echo "HEAD is ${age}s old (<24h): preparing"; echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "HEAD is ${age}s old (>=24h): nothing landed today, skipping"; echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.run == 'yes'
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ezclassify'

      - name: Pin npm
        if: steps.gate.outputs.run == 'yes'
        run: npm install -g npm@11.21.1

      - name: Install
        # Third-party only. This repository depends on no EzClassify package it
        # does not also contain, which is the whole point of the boundary and
        # the reason this job can run when nothing else can.
        #
        # The same install CI runs, for the same reason. With no committed
        # lockfile a bare `npm ci` has nothing to read and exits EUSAGE, so
        # deps:relock writes one from an empty dependency tree and `npm ci`
        # then installs it frozen.
        #
        # The generate half is guarded rather than unconditional because
        # deps:relock deletes the lockfile before it re-resolves. With a
        # committed lockfile, a preparing job that regenerated it every night
        # would build and publish against third-party versions nobody
        # reviewed, silently. Guarded, the step honors committed bytes
        # whenever they exist.
        #
        # NODE_AUTH_TOKEN is set because setup-node above has already pointed
        # the @ezclassify scope at GitHub Packages. Every name in that scope
        # resolves to a workspace link here, so nothing should reach the
        # registry, but an unauthenticated read of GitHub Packages fails
        # outright instead of falling through to npmjs.
        if: steps.gate.outputs.run == 'yes'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          test -f package-lock.json || npm run deps:relock
          npm ci

      - name: Resolve the package list and the mirror version
        id: plan
        if: steps.gate.outputs.run == 'yes'
        # One source of truth. The stamp loop, the build, the pack loop and
        # the post-publish check all read scripts/mirror-packages.json, so they
        # cannot drift apart the way two hand-copied lists do.
        run: |
          echo "version=1.0.0-mirror.${{ github.run_id }}.${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "packages=$(node -p 'require("./scripts/mirror-packages.json").packages.join(" ")')" >> "$GITHUB_OUTPUT"

      - name: Stamp mirror version
        if: steps.gate.outputs.run == 'yes'
        run: |
          for pkg in ${{ steps.plan.outputs.packages }}; do
            npm pkg set "version=${{ steps.plan.outputs.version }}" -w "$pkg"
          done

      - name: The list is complete and every range admits a mirror version
        if: steps.gate.outputs.run == 'yes'
        # Runs AFTER the stamp so it checks what is about to be published, not
        # what was committed. Catches three things that otherwise ship quietly:
        # a publishable workspace nobody added to the list, a first-party
        # dependency written "^1.0.0" (which npm will not match against
        # 1.0.0-mirror.N, making the tarball uninstallable off this machine),
        # and a package the stamp did not reach.
        run: node scripts/check-mirror-list.mjs --expect-version "${{ steps.plan.outputs.version }}"

      - name: Build
        if: steps.gate.outputs.run == 'yes'
        # types, schemas and openapi build the compiled outputs their manifests
        # publish. The remaining packages publish maintained sources or data.
        run: npm run build

      - name: Pack the native mirror without publication hooks
        if: steps.gate.outputs.run == 'yes'
        run: |
          mkdir -p "$RUNNER_TEMP/contracts-mirror"
          for pkg in ${{ steps.plan.outputs.packages }}; do
            npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/contracts-mirror" -w "$pkg"
          done
          node scripts/development-mirror.mjs "$RUNNER_TEMP/contracts-mirror"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.gate.outputs.run == 'yes'
        id: artifact
        with:
          name: contracts-development-mirror-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contracts-mirror
          if-no-files-found: error
          retention-days: 1

  handoff:
    needs: prepare
    if: needs.prepare.outputs.ready == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - id: conductor
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.EZCLASSIFY_SPEC_BOT_APP_ID }}
          private-key: ${{ secrets.EZCLASSIFY_SPEC_BOT_PRIVATE_KEY }}
          owner: ezclassify
          repositories: release-train
          permission-contents: write
      - name: Deliver only the immutable native preparation identity
        env:
          GH_TOKEN: ${{ steps.conductor.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ARTIFACT_ID: ${{ needs.prepare.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.prepare.outputs.artifact-digest }}
        run: |
          jq -n --arg sha "$SOURCE_SHA" --argjson run "$RUN_ID" --argjson attempt "$RUN_ATTEMPT" --argjson artifact "$ARTIFACT_ID" --arg digest "sha256:${ARTIFACT_DIGEST#sha256:}" \
            '{event_type:"contracts-mirror-prepared",client_payload:{source_sha:$sha,run_id:$run,run_attempt:$attempt,artifact_id:$artifact,artifact_digest:$digest}}' > "$RUNNER_TEMP/mirror-dispatch.json"
          gh api --method POST repos/ezclassify/release-train/dispatches --input "$RUNNER_TEMP/mirror-dispatch.json"
