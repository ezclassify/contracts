name: Dispatch canonical spec change

# This repository is the source of record for the spec bundle the release
# pipeline vendors into the SDK mirrors. Without this workflow the only thing
# that notices a change here is the pipeline's hourly reconciliation, so a
# contract landing on main would sit unpropagated for up to an hour. This
# workflow sends the immediate notice.
#
# The path filter below is the whole point of the workflow, so it is not a
# guess: every entry is derived from what the vendoring engine actually reads,
# and scripts/tests/spec-dispatch-paths.spec.ts re-derives the same set from
# the source packages' own manifests on every CI run and fails if this list
# drifts from it or if any glob stops matching tracked files. A dispatch
# trigger that quietly matches nothing is worse than no trigger at all.

on:
  push:
    branches: [main]
    paths:
      # @ezclassify/openapi: the document itself. Only the YAML: openapi.json
      # is a restatement that the CI drift gate keeps in step, and it is not
      # part of the vendored bundle.
      - 'libs/openapi/openapi.yaml'
      # @ezclassify/schemas: the JSON schema bundle. It is generated by
      # `npm run bundle` and committed, so a regenerated bundle is a change
      # here like any authored file.
      - 'libs/schemas/generated/json-schemas/**'
      # @ezclassify/conformance: the corpus. Watched at the directory level
      # its package manifest declares rather than at the `v1` subdirectory the
      # bundle currently selects, so a future corpus version cannot land
      # unwatched. Over-firing costs one reconciliation run that finds the
      # mirrors current; under-firing loses the propagation entirely.
      - 'libs/conformance/cache/**'
      - 'libs/conformance/fixtures/**'
      - 'libs/conformance/plans/**'
      - 'libs/conformance/recordings/**'
      - 'libs/conformance/replayer-contract/**'
      - 'libs/conformance/semantic/**'
      - 'libs/conformance/wire/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Notify the release pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Deliberately no job-level `if` on the repository name. A skipped job
      # renders as a grey square with no explanation, which is how a dead
      # trigger stays invisible. The guard step below runs unconditionally and
      # says out loud which condition stopped the dispatch.
      CANONICAL_REPOSITORY: ezclassify/contracts
      # Name of the repository, under this repository's owner, that receives
      # the dispatch. Set as an Actions variable so the workflow carries no
      # receiver name of its own.
      DISPATCH_REPOSITORY: ${{ vars.EZCLASSIFY_SPEC_DISPATCH_REPOSITORY }}
      SPEC_BOT_APP_ID: ${{ secrets.EZCLASSIFY_SPEC_BOT_APP_ID }}
      SPEC_BOT_PRIVATE_KEY: ${{ secrets.EZCLASSIFY_SPEC_BOT_PRIVATE_KEY }}

    steps:
      # A missed immediate dispatch is recoverable, because the hourly
      # reconciliation reads the same committed artifacts, so a blocked
      # dispatch warns rather than failing the push. It must still be
      # legible in the run log, naming what did not happen.
      - name: Check dispatch preconditions
        id: guard
        run: |
          set -euo pipefail
          blocked=''
          if [ "${GITHUB_REPOSITORY}" != "${CANONICAL_REPOSITORY}" ]; then
            blocked="this is ${GITHUB_REPOSITORY}, not ${CANONICAL_REPOSITORY}"
          elif [ -z "${DISPATCH_REPOSITORY}" ]; then
            blocked='the EZCLASSIFY_SPEC_DISPATCH_REPOSITORY variable is not set in this repository'
          elif [ -z "${SPEC_BOT_APP_ID}" ] || [ -z "${SPEC_BOT_PRIVATE_KEY}" ]; then
            blocked='spec-bot App credentials are not provisioned in this repository'
          fi
          if [ -n "$blocked" ]; then
            echo "::warning::No contracts-spec-changed dispatch sent for ${GITHUB_SHA} (${blocked}). The spec bundle will not reach the SDK mirrors until the hourly reconciliation runs."
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Mint dispatch token
        if: ${{ steps.guard.outputs.ready == 'true' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.SPEC_BOT_APP_ID }}
          private-key: ${{ env.SPEC_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.DISPATCH_REPOSITORY }}
          permission-contents: write

      - name: Dispatch canonical spec change
        if: ${{ steps.guard.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        # `contracts_sha` is recorded for the run log only. The receiving
        # workflow reads no client_payload field: it clones contracts at main
        # and resolves HEAD itself, so this is provenance for a human reading
        # the dispatch, not an input the consumer acts on.
        run: |
          gh api --method POST \
            "repos/${{ github.repository_owner }}/${DISPATCH_REPOSITORY}/dispatches" \
            -f event_type=contracts-spec-changed \
            -f "client_payload[contracts_sha]=${GITHUB_SHA}"
