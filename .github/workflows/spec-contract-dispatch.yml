name: Dispatch canonical spec change

# Only a successful full CI run (workflow_dispatch with full=true) on the exact
# official main revision may start propagation.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dispatch:
    if: ${{ github.repository == 'ezclassify/contracts' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch')) }}
    name: Notify the release pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Freeze and verify the successful Contracts revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          main_sha="$(gh api repos/ezclassify/contracts/git/ref/heads/main --jq .object.sha)"
          if [ "$EVENT_NAME" = workflow_run ]; then
            run="$(gh api "repos/ezclassify/contracts/actions/runs/$EVENT_RUN_ID")"
            if [ "$(jq -er .head_sha <<< "$run")" != "$main_sha" ]; then
              echo "A newer main revision owns propagation; skip the superseded qualification."
              exit 0
            fi
          else
            run="$(gh api "repos/ezclassify/contracts/actions/workflows/ci.yml/runs?branch=main&head_sha=$main_sha&per_page=100" --jq '[.workflow_runs[] | select(.event == "workflow_dispatch")] | sort_by([.run_number,.run_attempt]) | last' )"
          fi
          jq -e --arg sha "$main_sha" '
            .head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch" and
            .status == "completed" and .conclusion == "success" and
            .path == ".github/workflows/ci.yml" and
            .repository.full_name == "ezclassify/contracts" and
            .head_repository.full_name == "ezclassify/contracts"' <<< "$run" >/dev/null
          run_id="$(jq -r .id <<< "$run")"
          attempt="$(jq -r .run_attempt <<< "$run")"
          jobs="$(gh api "repos/ezclassify/contracts/actions/runs/$run_id/attempts/$attempt/jobs?per_page=100")"
          # A dispatch with full=false also succeeds, with "full" skipped. It is
          # not a release acceptance run, so it ends here quietly rather than
          # failing the refusal check below.
          if [ "$EVENT_NAME" = workflow_run ] && ! jq -e '[.jobs[] | select(.name | startswith("full (")) | .conclusion] | length > 0 and all(. == "success")' <<< "$jobs" >/dev/null; then
            echo "CI run $run_id did not run the full job; nothing to propagate."
            exit 0
          fi
          jq -e --arg sha "$main_sha" --argjson id "$run_id" --argjson attempt "$attempt" '
            .total_count == (.jobs | length) and
            ([.jobs[].name] as $names | all(["ci","full (22)","full (24)"][]; . as $name | $names | index($name))) and
            all(.jobs[]; .status == "completed" and .conclusion == "success" and .head_sha == $sha and .run_id == $id and .run_attempt == $attempt)
          ' <<< "$jobs" >/dev/null
          echo "contracts_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "contracts_ci_run_id=$(jq -r .id <<< "$run")" >> "$GITHUB_OUTPUT"

      - name: Require the configured dispatch destination
        if: ${{ steps.source.outputs.contracts_sha != '' }}
        env:
          DISPATCH_REPOSITORY: ${{ vars.EZCLASSIFY_SPEC_DISPATCH_REPOSITORY }}
        run: test -n "$DISPATCH_REPOSITORY"
      - name: Mint dispatch token
        if: ${{ steps.source.outputs.contracts_sha != '' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.EZCLASSIFY_SPEC_BOT_APP_ID }}
          private-key: ${{ secrets.EZCLASSIFY_SPEC_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.EZCLASSIFY_SPEC_DISPATCH_REPOSITORY }}
          permission-contents: write

      - name: Dispatch verified canonical spec change
        if: ${{ steps.source.outputs.contracts_sha != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DISPATCH_REPOSITORY: ${{ vars.EZCLASSIFY_SPEC_DISPATCH_REPOSITORY }}
          CONTRACTS_SHA: ${{ steps.source.outputs.contracts_sha }}
          CONTRACTS_CI_RUN_ID: ${{ steps.source.outputs.contracts_ci_run_id }}
        run: |
          set -euo pipefail
          test -n "$DISPATCH_REPOSITORY"
          gh api --method POST "repos/ezclassify/$DISPATCH_REPOSITORY/dispatches" \
            -f event_type=contracts-spec-changed \
            -f "client_payload[contracts_sha]=$CONTRACTS_SHA" \
            -f "client_payload[contracts_ci_run_id]=$CONTRACTS_CI_RUN_ID"
