name: Dispatch canonical spec change

# Every merge to main tells release-train which Contracts commit to propagate to
# the SDK repositories.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-contract-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ github.repository == 'ezclassify/contracts' && github.ref == 'refs/heads/main' }}
    name: Notify the release pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the configured dispatch destination
        env:
          DISPATCH_REPOSITORY: ${{ vars.EZCLASSIFY_SPEC_DISPATCH_REPOSITORY }}
        run: test -n "$DISPATCH_REPOSITORY"

      - name: Mint dispatch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.EZCLASSIFY_SPEC_BOT_APP_ID }}
          private-key: ${{ secrets.EZCLASSIFY_SPEC_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.EZCLASSIFY_SPEC_DISPATCH_REPOSITORY }}
          permission-contents: write

      - name: Dispatch the canonical spec change
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DISPATCH_REPOSITORY: ${{ vars.EZCLASSIFY_SPEC_DISPATCH_REPOSITORY }}
          CONTRACTS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/ezclassify/$DISPATCH_REPOSITORY/dispatches" \
            -f event_type=contracts-spec-changed \
            -f "client_payload[contracts_sha]=$CONTRACTS_SHA"
